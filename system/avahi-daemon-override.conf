# Milo override for avahi-daemon
# Resets Avahi to eth0 before every start, preventing stale wlan0 config
# from a previous session from causing mDNS hostname conflicts at boot
# (e.g. milo.local becoming milo-2.local).
# Runtime interface switching is handled by the NetworkManager dispatcher
# (90-milo-network).

[Service]
ExecStartPre=/bin/sed -i 's/^allow-interfaces=.*/allow-interfaces=eth0/' /etc/avahi/avahi-daemon.conf
