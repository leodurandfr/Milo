# Milo override for avahi-daemon
# Applies Avahi interface from state file before every start.
# State file is managed by NetworkManager dispatcher (90-milo-network).
# This ensures the correct interface is always applied, even after Avahi restarts.
#
# Default: eth0 (if state file doesn't exist)
# Runtime switching: NetworkManager dispatcher updates state file

[Service]
ExecStartPre=/bin/bash -c 'IFACE=$(cat /var/lib/milo/avahi-interface 2>/dev/null || echo eth0); sed -i "s/^allow-interfaces=.*/allow-interfaces=$IFACE/" /etc/avahi/avahi-daemon.conf'
