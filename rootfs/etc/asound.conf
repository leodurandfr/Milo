# ALSA configuration for Milo with CamillaDSP
#
# Loopback subdevice layout:
#   slot 0  -> DSP input (pcm.camilladsp). Captured by milo-camilladsp on plughw:Loopback,1,0.
#             - In DIRECT mode: written by the active source via pcm.milo_<source>_direct.
#             - In MULTIROOM mode: written by snapclient via --soundcard camilladsp.
#             - These two writers are mutually exclusive (state machine invariant).
#   slots 1..7 -> per-source multiroom slots (card 1). Used only when MILO_MODE=multiroom.
#             Snapserver captures hw:1,1,N for each.
#
# snd-aloop hard-caps at 8 substreams/card (slots 0..7): card 1 "Loopback" is
# full (0=DSP, 1..7=the 7 original sources). Extra sources therefore live on a
# SECOND loopback card "LoopbackDLNA" (module: index=1,2
# id=Loopback,LoopbackDLNA pcm_substreams=8,8):
#   - DLNA  -> LoopbackDLNA subdevice 0; Snapserver captures hw:2,1,0.
#   - Qobuz -> LoopbackDLNA subdevice 1; Snapserver captures hw:2,1,1.
#
# CamillaDSP is ALWAYS in the audio path for volume control.

# High-quality resampler for all `type plug` rate conversions (e.g. 44.1 -> 48 kHz).
# Replaces ALSA's default linear interpolator with a sinc/polyphase converter.
defaults.pcm.rate_converter "speexrate_medium"

pcm.!default {
    type plug
    slave.pcm {
        type hw
        card sndrpihifiberry
        device 0
    }
}

ctl.!default {
    type hw
    card sndrpihifiberry
}

# === Dynamic aliases (with MILO_MODE environment variable) ===
# Routes to direct (via CamillaDSP) or multiroom (via Snapcast loopback)

pcm.milo_spotify {
    @func concat
    strings [
        "pcm.milo_spotify_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_bluetooth {
    @func concat
    strings [
        "pcm.milo_bluetooth_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_roc {
    @func concat
    strings [
        "pcm.milo_roc_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_radio {
    @func concat
    strings [
        "pcm.milo_radio_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_podcast {
    @func concat
    strings [
        "pcm.milo_podcast_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_airplay {
    @func concat
    strings [
        "pcm.milo_airplay_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_cd {
    @func concat
    strings [
        "pcm.milo_cd_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_dlna {
    @func concat
    strings [
        "pcm.milo_dlna_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_qobuz {
    @func concat
    strings [
        "pcm.milo_qobuz_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

# === Direct Mode (via CamillaDSP loopback) ===
# Audio always goes through CamillaDSP for volume control and optional DSP effects

pcm.milo_spotify_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_bluetooth_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_roc_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_radio_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_podcast_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_airplay_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_cd_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_dlna_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_qobuz_direct {
    type plug
    slave.pcm "camilladsp"
}

# === Multiroom Mode (via Snapcast loopback) ===
# Audio goes to Snapcast server, which distributes to clients
# Each client applies CamillaDSP locally for volume/effects

pcm.milo_spotify_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 3
    }
}

pcm.milo_bluetooth_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 1
    }
}

pcm.milo_roc_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 2
    }
}

pcm.milo_radio_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 4
    }
}

pcm.milo_podcast_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 5
    }
}

pcm.milo_airplay_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 6
    }
}

pcm.milo_cd_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 7
    }
}

# DLNA is the 8th source — card 1 is full (8-substream cap), so it uses the
# second loopback card "LoopbackDLNA" (subdevice 0). Snapserver reads hw:2,1,0.
pcm.milo_dlna_multiroom {
    type plug
    slave.pcm {
        type hw
        card LoopbackDLNA
        device 0
        subdevice 0
    }
}

# Qobuz is the 9th source — also on the second loopback card "LoopbackDLNA"
# (subdevice 1, a free slot). Snapserver reads hw:2,1,1.
pcm.milo_qobuz_multiroom {
    type plug
    slave.pcm {
        type hw
        card LoopbackDLNA
        device 0
        subdevice 1
    }
}

# === CamillaDSP device ===
# Routes audio through Loopback device subdevice 0 for CamillaDSP processing
# CamillaDSP captures from hw:Loopback,1,0 and outputs to hw:sndrpihifiberry,0

pcm.camilladsp {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 0
    }
}
