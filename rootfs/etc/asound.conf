# ALSA configuration for Milo with CamillaDSP
#
# Loopback subdevice layout:
#   slot 0  -> DSP input (pcm.camilladsp). Captured by milo-camilladsp on plughw:Loopback,1,0.
#             - In DIRECT mode: written by the active source via pcm.milo_<source>_direct.
#             - In MULTIROOM mode: written by snapclient via --soundcard camilladsp.
#             - These two writers are mutually exclusive (state machine invariant).
#   slots 1..7 -> per-source multiroom slots. Used only when MILO_MODE=multiroom.
#             Snapserver captures hw:1,1,N for each.
#
# Sources are strictly contiguous in slots 1..7; DSP is isolated in slot 0
# so adding a future source (pcm_substreams bump -> slot 8) does not require reshuffling.
#
# CamillaDSP is ALWAYS in the audio path for volume control.

pcm.!default {
    type plug
    slave.pcm {
        type hw
        card sndrpihifiberry
        device 0
    }
}

ctl.!default {
    type hw
    card sndrpihifiberry
}

# === Dynamic aliases (with MILO_MODE environment variable) ===
# Routes to direct (via CamillaDSP) or multiroom (via Snapcast loopback)

pcm.milo_spotify {
    @func concat
    strings [
        "pcm.milo_spotify_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_bluetooth {
    @func concat
    strings [
        "pcm.milo_bluetooth_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_roc {
    @func concat
    strings [
        "pcm.milo_roc_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_radio {
    @func concat
    strings [
        "pcm.milo_radio_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_podcast {
    @func concat
    strings [
        "pcm.milo_podcast_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_airplay {
    @func concat
    strings [
        "pcm.milo_airplay_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

pcm.milo_cd {
    @func concat
    strings [
        "pcm.milo_cd_"
        { @func getenv vars [ MILO_MODE ] default "direct" }
    ]
}

# === Direct Mode (via CamillaDSP loopback) ===
# Audio always goes through CamillaDSP for volume control and optional DSP effects

pcm.milo_spotify_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_bluetooth_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_roc_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_radio_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_podcast_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_airplay_direct {
    type plug
    slave.pcm "camilladsp"
}

pcm.milo_cd_direct {
    type plug
    slave.pcm "camilladsp"
}

# === Multiroom Mode (via Snapcast loopback) ===
# Audio goes to Snapcast server, which distributes to clients
# Each client applies CamillaDSP locally for volume/effects

pcm.milo_spotify_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 3
    }
}

pcm.milo_bluetooth_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 1
    }
}

pcm.milo_roc_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 2
    }
}

pcm.milo_radio_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 4
    }
}

pcm.milo_podcast_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 5
    }
}

pcm.milo_airplay_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 6
    }
}

pcm.milo_cd_multiroom {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 7
    }
}

# === CamillaDSP device ===
# Routes audio through Loopback device subdevice 0 for CamillaDSP processing
# CamillaDSP captures from hw:Loopback,1,0 and outputs to hw:sndrpihifiberry,0

pcm.camilladsp {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 0
    }
}
