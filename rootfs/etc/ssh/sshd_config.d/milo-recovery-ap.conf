# No SSH from a client of an open Milō access point: this unit's recovery AP
# (core/network/service.py), or a speaker's setup hotspot while an adoption
# holds wlan0 on it (core/multiroom/wifi_adoption.py), where this unit is one
# 10.42.0.x client among whoever else joined. Both are open, so anyone in radio
# range can join them; the API refuses them its writes (api/middleware.py), and
# a shell is the one write left to refuse.
# Matched on the client's own address, not on the one it dialed: on the
# speaker's hotspot this unit's address is not the AP's, and a client of either
# can reach this unit by its LAN address as well. The shell stays reachable over
# the home network, Ethernet included — unless that network is numbered
# 10.42.0.0/24 itself. Both links carry no IPv6, so no link-local address walks
# around this IPv4 match. The subnet is RECOVERY_AP_SUBNET
# (backend/config/constants.py), held equal by test_recovery_ap_lockdown.py.
Match Address 10.42.0.0/24
    RefuseConnection yes
