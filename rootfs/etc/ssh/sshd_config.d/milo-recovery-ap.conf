# No SSH from a client of the recovery access point (core/network/service.py).
# The AP is open, so anyone in radio range can join it; the API refuses them
# its writes (api/middleware.py), and a shell is the one write left to refuse.
# Matched on the address the AP pins on wlan0, so the shell stays reachable
# over the home network, Ethernet included. The address is RECOVERY_AP_ADDRESS
# (backend/config/constants.py), held equal by test_recovery_ap_lockdown.py.
Match LocalAddress 10.42.0.1
    RefuseConnection yes
