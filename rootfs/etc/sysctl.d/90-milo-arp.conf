# Milō: each interface answers ARP for its own addresses only.
#
# Twin of milo-client/rootfs/etc/sysctl.d/90-milo-arp.conf — server and
# satellite are deployed from separate trees, same logic on both.
#
# Milō keeps eth0 and wlan0 up on the same LAN, for a fast WiFi fallback. Out of
# the box Linux answers ARP for any of its addresses on any interface ("ARP
# flux"), so eth0 answered for the address wlan0 holds. NetworkManager probes a
# renewed lease for conflicts (RFC 5227) and took that answer for another host:
# measured on the server 2026-10-15, `arping -D -I wlan0 192.168.1.39` was
# answered by eth0's MAC, the renewal "detected a conflict" and removed the
# address from wlan0 for 79 s — and a satellite whose stream used it lost the
# room. arp_ignore=1: an interface answers only for its own addresses.
# arp_announce=2: it announces only its own addresses (the same false conflict
# was also raised passively by eth0 sending requests from wlan0's address).
# Each address is then reached through the interface that holds it.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
