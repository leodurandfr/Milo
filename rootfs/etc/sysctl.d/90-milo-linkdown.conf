# Milō: a route over a cable with no carrier is never chosen.
#
# Twin of milo-client/rootfs/etc/sysctl.d/90-milo-linkdown.conf — server and
# satellite are deployed from separate trees, same logic on both.
#
# Ethernet is preferred and WiFi is the fallback (owner, 2026-11-06): eth0's
# routes win on metric (100 against wlan0's 600). When the cable goes, Linux
# keeps those routes, flagged `linkdown`, and keeps choosing them until
# NetworkManager deactivates eth0 and removes its address, seconds later. A
# reconnection in that window sends its SYN, or the server its SYN-ACK, into a
# dead port: a satellite's reconnect to the server waited 22 s on 2026-11-05
# (Canapé, 17:31:16 -> 17:31:38), and the server's own fallback to WiFi was
# measured at ~7 s. With this set, the routes of a link without carrier are
# skipped the instant carrier drops, and the traffic leaves by wlan0 at once.
# IPv4 reads `all` OR the interface's own value. IPv6 reads the interface's
# value only: writing `all` copies it to `default` and to every interface that
# exists, and `default` gives it to an interface created later.
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv4.conf.default.ignore_routes_with_linkdown = 1
net.ipv6.conf.all.ignore_routes_with_linkdown = 1
net.ipv6.conf.default.ignore_routes_with_linkdown = 1
