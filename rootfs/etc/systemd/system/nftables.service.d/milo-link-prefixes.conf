# Milō: the IPv6 firewall fills its link-prefix set whenever it is loaded, and
# stopping it removes its own table only.
#
# Twin of milo-client/rootfs/etc/systemd/system/nftables.service.d/milo-link-prefixes.conf — server and
# satellite are deployed from separate trees, same logic on both.
#
# Debian's nftables.service loads /etc/nftables.conf at start and at reload,
# and either load starts the `link_prefixes` set empty (see that file): the
# dispatcher script that keeps it runs after both (an ExecReload= in a drop-in
# is appended to Debian's). `-`: the ruleset is in force once it is loaded, and
# a set left empty still refuses the Internet and lets the link in over
# fe80::/10, so a failure to fill it is logged here and the unit's state keeps
# saying whether the ruleset is loaded.
#
# Debian stops the unit with `nft flush ruleset`, which also wipes the tables
# NetworkManager writes for a shared (hotspot) connection. The ruleset loaded
# here is one `ip6` table; stopping deletes that table and nothing else.
#
# It sits in rootfs/, which milo-deploy-update and milo-client-deploy-update
# install whole (the image copies it beside the ruleset), rather than in
# system/, from which they install only *.service and the avahi-daemon override
# each one names by path: there, every install path would need a copy step of
# its own for it.
[Service]
ExecStartPost=-/etc/NetworkManager/dispatcher.d/50-milo-ipv6-link-prefixes
ExecReload=-/etc/NetworkManager/dispatcher.d/50-milo-ipv6-link-prefixes
ExecStop=
ExecStop=-/usr/sbin/nft delete table ip6 milo
