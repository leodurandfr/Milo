// Milo AirPlay 2 Configuration
general = {
    name = "Milō · AirPlay";
    interpolation = "auto";
    output_backend = "alsa";
    mdns_backend = "avahi";
    ignore_volume_control = "yes";
};

alsa = {
    output_device = "milo_airplay";
    // Match the bit depth CamillaDSP captures (S32_LE) instead of letting
    // "auto" settle on S16_LE, so the ALSA `plug` no longer truncates to 16 bits
    // on the way in. The rate stays on "auto": 5.2.1 does accept a single
    // output_rate = 48000 (4.x took 44.1 kHz multiples only), which would also
    // remove the 44.1 -> 48 kHz `plug` conversion — unmeasured on a unit, so
    // not taken here.
    output_format = "S32_LE";
};

metadata = {
    enabled = "yes";
    include_cover_art = "yes";
    pipe_name = "/tmp/shairport-sync-metadata";
    pipe_timeout = 5000;
};
