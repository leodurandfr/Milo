[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [
    "venv",
    ".venv",
    "frontend",
    "rootfs",
    "install",
    "scripts",
]

[tool.ruff.lint]
# Rules activated progressively per lot — history in docs/development.md (lint floor).
#   Lot B: S110 (try-except-pass) + S112 (try-except-continue) — locks RFC 18
#          silent-swallow doctrine. Intentional swallows must use
#          `contextlib.suppress(...)` (Pythonic idiom, exempt by design).
#   BLE001 (blind `except Exception`) is intentionally NOT activated: the
#          codebase has ~370 legitimate logged-and-handled broad catches
#          (best-effort hardware, route translators, background-loop bodies).
#          Activating BLE001 would force a mass refactor with no real safety
#          gain — the doctrine in CLAUDE.md already requires that broad
#          catches log + raise / log + warning. Re-arbitrate if needed.
#   Lot C: F (pyflakes) — undefined names, redefinitions, unused imports and
#          variables. Selected as a family rather than rule by rule: F401 alone
#          is the least valuable member, and enabling it while F821/F811/F841
#          stay off is the drift this repo keeps re-filing as findings.
#          E4/E7/E9 stay out on purpose — the E402s in api/models.py and
#          main.py (imports after code) and the E731 lambdas in tests are
#          deliberate, and they are style, not faults.
select = [
    "F",     # pyflakes — real faults: undefined name, redefinition, dead import/variable
    "S110",  # try-except-pass — silent swallow with bare pass
    "S112",  # try-except-continue — silent swallow with bare continue
]

[tool.ruff.lint.per-file-ignores]
# Whitelist populated progressively per lot.
# dbus-next declares D-Bus signatures as string annotations ('o' = object path,
# 's' = string, 'u'/'q' = integers). They are wire type codes, not Python names,
# so every one of them reads as a forward reference ruff cannot resolve.
"backend/sources/bluetooth/agent.py" = ["F821"]

