[pytest]
# pytest configuration for the Milo backend

# Where tests are collected from
testpaths = tests

# Test file pattern
python_files = test_*.py

# Test class pattern
python_classes = Test*

# Test function pattern
python_functions = test_*

# Verbose by default
addopts =
    -v
    --tb=short
    --strict-markers

# Warnings are shown, and the suite raises none of its own. `--disable-warnings`
# used to hide them all, and with them nine tests leaving coroutines un-awaited
# (mocks shaped unlike what they stand for). What is filtered below is third
# party and named, so a new warning from this code base is seen.
filterwarnings =
    # dbus_next decorates with typing.no_type_check_decorator (removed in 3.15).
    ignore::DeprecationWarning:dbus_next.*
    # SWIG-built extensions (the lgpio bindings) on Python 3.13.
    ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning
    # FastAPI's TestClient still runs on httpx; the replacement is upstream's to ship.
    ignore:Using `httpx` with `starlette.testclient` is deprecated

# Custom markers. `unit`, `integration` and `slow` used to be declared here and
# were never applied to a single test -- `pytest -m "not integration"` selected
# the whole suite, which is worse than having no way to narrow it. The tests
# under tests/integration/ are mounted entirely on mocks, so the distinction the
# marker claimed does not exist: they are service-behaviour tests across a mocked
# boundary, like most of the suite. Select by path or by -k instead.
markers =
    asyncio: Asynchronous tests

# asyncio configuration
asyncio_mode = auto
