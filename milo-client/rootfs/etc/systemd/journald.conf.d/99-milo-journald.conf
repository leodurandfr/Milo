# Milō: keep the systemd journal on disk so boot-time failures survive a reboot.
#
# Twin of rootfs/etc/systemd/journald.conf.d/99-milo-journald.conf — server and
# satellite are deployed from separate trees, same logic on both.
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# with Storage=volatile (RAM-only) to spare the SD card. A volatile journal,
# however, wipes the evidence of any failed boot on the recovery reboot — so
# NetworkManager-not-starting and similar boot incidents can never be diagnosed
# after the fact.
#
# A drop-in in /etc/ outranks the vendor drop-in in /usr/lib/ (and the "99-"
# prefix sorts last for good measure), so this re-enables persistent storage.
# The caps bound SD-card wear.
#
# The rate limit is a net under every unit: journald's default (10,000 lines
# per 30 s per unit, scaled up with free space) let one daemon's warnings fill
# the 100 MB in five minutes on 2026-09-24 and evict everyone else's history
# (E74). The loudest legitimate burst measured is ~320 lines per 30 s (a
# backend restart); journald reports what it suppresses, so a cut is visible.
[Journal]
Storage=persistent
SystemMaxUse=100M
RuntimeMaxUse=100M
MaxRetentionSec=7d
RateLimitIntervalSec=30s
RateLimitBurst=1000
