# Milo Client Avahi Configuration
# Ethernet is the default mDNS interface. WiFi failover is handled
# by the NetworkManager dispatcher (90-milo-network).
# Config is reset to eth0 at every boot via systemd ExecStartPre.
#
# Both allow- and deny-interfaces are necessary: Avahi 0.8 only enforces
# allow-interfaces at startup enumeration, so newly-added interfaces (e.g.
# wlan0 reconnecting) bypass it. deny-interfaces is checked on every
# interface event and keeps Avahi strictly mono-interface, preventing the
# self-loop rename to milo-client-2.local.

[server]
allow-interfaces=eth0
deny-interfaces=wlan0
use-ipv4=yes
use-ipv6=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
publish-workstation=yes
publish-hinfo=no
publish-domain=yes

[reflector]
enable-reflector=no

[rlimits]
