# Milō: a wired link is up once it has IPv4, not as soon as it has IPv6.
#
# Twin of rootfs/etc/NetworkManager/conf.d/90-milo-ethernet-ipv4.conf — server and
# satellite are deployed from separate trees, same logic on both.
#
# NetworkManager declares a device active as soon as IPv4 *or* IPv6 is up, and
# IPv6 comes first on this LAN: measured, eth0 "activated" 1 s before its IPv4
# lease on a satellite and 12 s before it on the server, with wlan0 leased in
# between. Whatever waited for the network then used the WiFi address — the
# satellite's snapclient connected from it and kept it, the server published
# milo.local on it. Here a wired link is active only once it has IPv4 (or 30 s
# of trying), so network-online.target means "on the cable" when there is one.
[connection-milo-ethernet]
match-device=type:ethernet
ipv4.required-timeout=30000
