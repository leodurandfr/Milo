#!/usr/sbin/nft -f
# Milō: no connection reaches this unit over IPv6 from beyond its own link.
#
# Twin of rootfs/etc/nftables.conf — server and
# satellite are deployed from separate trees, same logic on both.
#
# Every daemon on a unit that listens on [::] — sshd :22, snapserver :1704,
# rpcbind :111 (tcp and udp), shairport-sync :7000, go-librespot's zeroconf on
# a port it picks at start (:39277 when measured), all measured with
# `ss -tlnu` — is reachable from the whole Internet the moment the router hands
# out a global prefix and lets inbound IPv6 through, which is the router's
# choice, not Milō's. This is RFC 6092's default deny, applied on the host so it
# does not depend on the router: a new inbound IPv6 connection is accepted only
# from the link (fe80::/10), a unique local address (fc00::/7), or one of the
# global prefixes the unit's own interfaces carry. Loopback, the replies to what
# the unit opened itself, ICMPv6 errors (types 1-4, packet-too-big among them:
# without it path-MTU discovery breaks every outgoing connection) and neighbor
# discovery (133-136) pass from anywhere. Nothing else does.
#
# IPv4 is not this file's: it declares one `ip6` table and no `flush ruleset`,
# which would also wipe the tables NetworkManager writes for a shared (hotspot)
# connection. Declaring the table, deleting it and defining it again replaces
# exactly this table, atomically, at every load (start and reload alike).
#
# `link_prefixes` starts empty at every load. The script that fills it is
# 50-milo-ipv6-link-prefixes, in NetworkManager's dispatcher.d: run by
# nftables.service once the ruleset is loaded (its milo-link-prefixes.conf
# drop-in), by NetworkManager on every connection event after that, and once
# more a little after each. Until it has run, a LAN peer reaches the unit over
# its link-local address or IPv4.
#
# Read by test_ipv6_firewall.py, which evaluates this chain for the listeners
# above: only the subset of nft it models may appear in it.

table ip6 milo
delete table ip6 milo

table ip6 milo {
    set link_prefixes {
        type ipv6_addr
        flags interval
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
        icmpv6 type { nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        ip6 saddr fe80::/10 accept
        ip6 saddr fc00::/7 accept
        ip6 saddr @link_prefixes accept
    }
}
