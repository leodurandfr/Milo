# ALSA configuration for Milo Client
# ==================================
# One path, no selector: Snapclient -> Loopback -> CamillaDSP -> HiFiBerry.
# CamillaDSP is always in the chain because it is the only attenuation stage
# (invariant 7); the card's own mixer is pinned at unity by milo-alsa-passthrough.
# `pcm.!default` below reaches the card directly, for a bare `aplay` when
# diagnosing — nothing in the audio path uses it.

# High-quality resampler for all `type plug` rate conversions (e.g. 44.1 -> 48 kHz).
# Replaces ALSA's default linear interpolator with a sinc/polyphase converter.
defaults.pcm.rate_converter "speexrate_medium"

# === Default Output ===
# Routes to HiFiBerry directly (no DSP)
pcm.!default {
    type plug
    slave.pcm "hifiberry"
}

ctl.!default {
    type hw
    card sndrpihifiberry
}

# === HiFiBerry Direct Output ===
pcm.hifiberry {
    type plug
    slave.pcm {
        type hw
        card sndrpihifiberry
        device 0
    }
}

# === CamillaDSP Input (via Loopback) ===
# Audio sent here is captured by CamillaDSP for processing
pcm.camilladsp_input {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 0
    }
}
