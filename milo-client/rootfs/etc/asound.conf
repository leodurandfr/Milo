# ALSA configuration for Milo Client
# ==================================
# One path, no selector: Snapclient -> Loopback -> CamillaDSP -> HiFiBerry.
# CamillaDSP is always in the chain because it is the only attenuation stage
# (invariant 7); the card's own mixer is pinned at unity by milo-alsa-passthrough.
# `pcm.!default` below reaches the card directly, for a bare `aplay` when
# diagnosing — nothing in the audio path uses it.

# High-quality resampler for all `type plug` rate conversions (e.g. 44.1 -> 48 kHz).
# Replaces ALSA's default linear interpolator with a sinc/polyphase converter.
defaults.pcm.rate_converter "speexrate_medium"

# === Default Output ===
# Routes to HiFiBerry directly (no DSP)
pcm.!default {
    type plug
    slave.pcm "hifiberry"
}

ctl.!default {
    type hw
    card sndrpihifiberry
}

# === HiFiBerry Direct Output ===
pcm.hifiberry {
    type plug
    slave.pcm {
        type hw
        card sndrpihifiberry
        device 0
    }
}

# === CamillaDSP Input (via Loopback) ===
# Audio sent here is captured by CamillaDSP for processing.
# The card itself comes from the image's /etc/modprobe.d/snd-aloop.conf, the
# server tree's file both roles share — addressed by NAME here and in
# the CamillaDSP capture, so the card index it lands on does not matter.
pcm.camilladsp_input {
    type plug
    slave.pcm {
        type hw
        card Loopback
        device 0
        subdevice 0
    }
}

# snapclient looks its --soundcard up among the PCMs snd_device_name_hint()
# enumerates (`aplay -L`), and logs "PCM device ... not found" at err on every
# start when it is absent, then opens the name anyway. A `hint { show on }`
# inside the PCM cannot list it: alsa-lib follows the slave, takes a `type hw`
# slave's `device` for a card device and drops the PCM from the software list,
# and the per-card pass finds no CARD= argument to give it. So the name is
# listed on its own ("NAME|DESC"), outside the audio path.
namehint.pcm {
    camilladsp_input "camilladsp_input|Milo DSP input (Loopback slot 0, captured by CamillaDSP)"
}
