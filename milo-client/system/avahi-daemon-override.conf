# Milo override for avahi-daemon
# Resets allow/deny-interfaces to ethernet defaults before every start. The
# dispatcher (90-milo-network) flips them at runtime when ethernet is lost.
#
# Both keys are needed: Avahi 0.8 only enforces allow-interfaces during the
# initial interface enumeration — newly-added interfaces (wlan0 reconnecting,
# DHCP lease rolling over) bypass it. deny-interfaces is checked on every
# interface event and keeps Avahi strictly mono-interface, preventing the
# self-loop rename to milo-client-2.local.

[Service]
ExecStartPre=/bin/sed -i -e 's/^allow-interfaces=.*/allow-interfaces=eth0/' -e 's/^deny-interfaces=.*/deny-interfaces=wlan0/' /etc/avahi/avahi-daemon.conf

