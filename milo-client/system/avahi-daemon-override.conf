# Milo override for avahi-daemon
# Applies Avahi interface (allow + deny) from the state file before every
# start, ensuring the correct interfaces are baked into the config even
# after Avahi restarts.
#
# State file is managed by NetworkManager dispatcher (90-milo-network).
# Default: eth0 (if state file doesn't exist).
#
# See milo-client-apply-avahi-iface for why both allow- and deny- are needed,
# and why a hardcoded reset here defeated the WiFi fallback.

[Service]
ExecStartPre=/usr/local/bin/milo-client-apply-avahi-iface
