<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="No cover art">
  <!-- Minimalist disc, shown wherever a cover is missing (album, track, playlist,
       artist, CD). Geometry and sheen are both measured from the pressed-CD
       artwork this replaces, not redrawn by eye: an annulus of r 198.9 around a
       hole of r 71.2, with no radial component whatsoever — the original is flat
       from the hole to the rim along every angle — lit by a purely angular
       gradient whose period is 180 degrees.

       SVG has no conic gradient, so it is 240 annular sectors carrying the
       sampled profile. Half of them are written: the artwork's own 180-degree
       symmetry lets the second half be the first rotated, which also averages
       out the JPEG noise the samples came with. The sectors are exactly
       adjacent, never overlapping — two translucent shapes sharing an edge
       composite to about the right value, while an overlap composites twice and
       draws a visible darker spoke. Measured, on the first attempt at this file.

       Opacities are the measured ones scaled 2.2x. The original was drawn on a
       baked white background and read as almost nothing once the ground could be
       any colour; this is the level at which it holds on both card colours
       without competing with a real cover.

       No filter, deliberately: these render dozens at a time in the library and
       podcast grids, on a Pi with no GPU, and a per-instance Gaussian blur was
       the cheaper-looking way to smooth the same 240 steps down to 72.

       One neutral gray throughout, opacity only, so the file sits on a card of
       any colour and the centre hole shows that colour rather than the baked
       white the JPEG carried. -->
  <defs><g id="music-placeholder-half" fill="#8a9099">
