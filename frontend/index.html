<!doctype html>
<html lang="fr" class="notranslate" translate="no">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">


  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="google" content="notranslate" />
  <title>Milō</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Milō">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- Boot mode: kiosk (no logo, Plymouth carried it), fast-boot (reload), PWA cold start (delayed logo), remote cold start (immediate logo) -->
  <script>
    if(location.hostname==='localhost'){
      document.documentElement.classList.add('kiosk-boot')
    } else if(sessionStorage.getItem('milo_booted')){
      document.documentElement.classList.add('fast-boot')
    } else if(window.navigator.standalone||matchMedia('(display-mode: standalone)').matches){
      document.addEventListener('DOMContentLoaded',function(){requestAnimationFrame(function(){requestAnimationFrame(function(){setTimeout(function(){document.documentElement.classList.add('logo-ready')},100)})})})
    } else {
      document.documentElement.classList.add('logo-ready')
    }
  </script>

  <!-- Boot screen styles - visible immediately, fades out after WebSocket connects -->
  <!-- Values aligned with design-system.css (inline because CSS not loaded at boot) -->
  <style>
    #boot-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f7f7f7; /* --color-background */
      z-index: 99999;
      opacity: 1;
      transition: opacity 200ms ease; /* --transition-fast */
    }

    #boot-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #boot-screen.logo-exit .boot-logo {
      opacity: 0;
    }

    .boot-logo {
      height: 48px;
      width: auto;
      transition: opacity 0.3s ease-out;
      opacity: 0;
    }

    .logo-ready .boot-logo {
      opacity: 1;
    }

    /* Fast boot: hide logo (user already saw it this session) */
    .fast-boot .boot-logo {
      display: none;
    }

    /* Kiosk: the Pi screen already showed the logo and the progress bar in
       Plymouth, which held the display until the backend answered. This is only
       a black holding frame continuing the retained splash — no second logo, and
       black on black hides the compositor's own startup frame in between. */
    .kiosk-boot,
    .kiosk-boot #boot-screen {
      background: #000000;
    }

    .kiosk-boot .boot-logo {
      display: none;
    }

    /* Reconnection message - positioned at bottom */
    .boot-message {
      position: absolute;
      bottom: 48px; /* --space-09 */
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 200ms ease;
    }

    #boot-screen.show-message .boot-message {
      opacity: 1;
    }

    .boot-message-text {
      /* text-mono style */
      font-family: 'Space Mono Regular', 'Noto Sans Devanagari', 'Noto Sans SC', monospace;
      font-size: 16px;
      line-height: 20px;
      letter-spacing: -0.02em; /* -2% */
      color: #767b76; /* --color-text-secondary */
      background: #f2f2f2; /* --color-background-strong */
      padding: 8px 16px; /* --space-02 --space-04 */
      border-radius: 4px; /* --radius-01 */
      margin: 0;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <!-- Boot screen - shows logo on first load, skips it on refresh -->
  <div id="boot-screen">
    <svg xmlns="http://www.w3.org/2000/svg" class="boot-logo" viewBox="0 0 57 32">

        <path d="M35.3462 7.33203H37.6862V26H35.3462V7.33203Z"/>
        <path d="M31.0373 10.036H28.4893V7.33203H31.0373V10.036ZM28.5933 12.402H30.9333V26H28.5933V12.402Z"/>
        <path d="M21.542 9.59403L13.482 26H11.4019L3.31595 9.59403V26H0.897949V7.33203H4.77195L12.4679 23.036L20.19 7.33203H23.9599V26H21.542V9.59403Z"/>
      </g>
    </svg>

    <!-- Reconnection message (hidden by default, shown on error/disconnect) -->
    <div class="boot-message">
      <p class="boot-message-text"></p>
    </div>
  </div>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
