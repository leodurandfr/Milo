name: Feature request
description: Something Milō could do, or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it would work, from where you stand (the screen, a remote, an app).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered instead
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: Milō version, Raspberry Pi model, audio card, multiroom or not, if it matters.
