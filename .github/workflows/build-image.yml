name: Build Milo Image

on:
  push:
    tags:
      - 'v*'
  # Weekly, because a build that only runs on a tag is a build nobody runs. This
  # one was broken for three months — `dependencies.env` landed on 2026-08-19 and
  # the stage had sourced a file no builder copied ever since — and the only
  # reason it went unnoticed is that the last tag is v0.1.0. A schedule turns
  # that into a week. Off the top of the hour, and off lint.yml's day, for the
  # reason lint.yml gives: GitHub drops on-the-hour scheduled runs under load.
  schedule:
    - cron: '23 3 * * 3'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to build'
        required: false
        default: 'main'

# A fork runs this file too. It builds there on a tag it pushes and on a manual
# run, from its own repository (the Configure pi-gen step names it to the
# image), but it never spends its schedule — the `vars` job every other job
# needs is skipped on a fork's cron — and never publishes a release: units are
# offered the releases of the repository backend/core/updates/catalog.py names,
# and a fork's draft beside its own tags would only look like one. Held by
# backend/tests/architecture/test_ci_forks.py.

# Actions are named by commit, with their release beside them, and no checkout
# keeps the token — lint.yml says why and how a pin moves. pi-gen is pinned the
# same way, in pi-gen/upstream.env. Held by
# backend/tests/architecture/test_ci_pins.py.

jobs:
  # What is being built, decided once. Three jobs read it, and the frontend
  # asset's and the release manifest's names are part of the answer: the
  # backend builds the very same names from `frontend_asset_url` and
  # `release_manifest_url` in backend/core/updates/catalog.py to download them
  # during an OTA update, and the spellings are pinned together by
  # backend/tests/architecture/test_release_channel.py.
  #
  # The commit too, resolved here once: every job that reads the tree checks it
  # out, and the image clones it. A branch name is read anew by each reader —
  # three checkouts, then the chroot's clone hours into the build — and main
  # moves several times a day, so naming the branch built an image of one
  # commit's stage and frontend around another commit's checkout.
  vars:
    name: Resolve what is being built
    if: github.event_name != 'schedule' || github.repository == 'leodurandfr/Milo'
    runs-on: ubuntu-24.04
    outputs:
      milo_ref: ${{ steps.set.outputs.milo_ref }}
      milo_commit: ${{ steps.set.outputs.milo_commit }}
      image_name: ${{ steps.set.outputs.image_name }}
      is_release: ${{ steps.set.outputs.is_release }}
      is_prerelease: ${{ steps.set.outputs.is_prerelease }}
      frontend_asset: ${{ steps.set.outputs.frontend_asset }}
      release_manifest: ${{ steps.set.outputs.release_manifest }}
    steps:
      - name: Set build variables
        id: set
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag push: the release being built.
            REF="${GITHUB_REF#refs/tags/}"
            COMMIT="${GITHUB_SHA}"
            echo "image_name=milo-${REF}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            # A tag carrying a suffix — v0.2.0-rc1, v0.3.0-beta.2 — is a
            # pre-release. Publishing it as one keeps it out of
            # `releases/latest`, which is the endpoint the update flow offers
            # from: no unit in the field is ever shown it. The backend refuses
            # a non-plain tag on its own side too (helpers.is_stable_release),
            # deliberately — one guarantee spelled twice, because each half
            # survives the other being changed by accident.
            if [[ "${REF}" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            REF="${{ github.event.inputs.branch || 'main' }}"
            # The ref's commit, not the one the run was launched from: a
            # dispatch of a tag from main is that tag. Read from the URL the
            # image clones, as the clone reads it: a tag peeled to its commit,
            # else the branch — or a full hash, taken as it is.
            if [[ "${REF}" =~ ^[0-9a-f]{40}$ ]]; then
              COMMIT="${REF}"
            else
              COMMIT="$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
                  "refs/tags/${REF}" "refs/tags/${REF}^{}" "refs/heads/${REF}" | awk -v ref="${REF}" '
                $2 == "refs/tags/" ref "^{}" { peeled = $1 }
                $2 == "refs/tags/" ref       { tag = $1 }
                $2 == "refs/heads/" ref      { head = $1 }
                END { print (peeled != "" ? peeled : (tag != "" ? tag : head)) }')"
            fi
            echo "image_name=milo-${REF}-${COMMIT:0:7}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo "cannot resolve ${REF} to a commit: '${COMMIT}'" >&2; exit 1; }
          echo "milo_ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "milo_commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "frontend_asset=milo-frontend-${REF}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "release_manifest=milo-release-${REF}.manifest" >> "$GITHUB_OUTPUT"

  # The frontend is built exactly once, here, and both consumers take that one
  # artefact: the image bakes it in, and the release publishes it for units to
  # download on an OTA update. It used to be built twice — in the pi-gen chroot
  # and again on every Pi during an update — with `npm install` rather than
  # `npm ci` and with whatever Node `n stable` had left on the unit, so no two
  # units ran the same bytes and a bad hour at the npm registry blocked the
  # whole fleet from updating at all.
  frontend:
    name: Build the frontend artefact
    needs: vars
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.vars.outputs.milo_commit }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` installs the lockfile, not a fresh resolution of the ranges in
      # package.json. That is the whole difference between "the tree this release
      # was tested with" and "whatever was current the day the job ran".
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Pack it with its checksum
        run: |
          ASSET="${{ needs.vars.outputs.frontend_asset }}"
          tar -czf "$ASSET" -C frontend dist
          sha256sum "$ASSET" > "${ASSET}.sha256"
          ls -lh "$ASSET"*
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: |
            ${{ needs.vars.outputs.frontend_asset }}
            ${{ needs.vars.outputs.frontend_asset }}.sha256
          retention-days: 14

  # The CI checks (lint.yml), run on the tree being built: the build needs them,
  # so a tag cut on a commit they fail publishes nothing. The units that take a
  # release judge it only once it is installed, and the CI suite is the one
  # check that runs before any unit is offered it.
  checks:
    name: CI checks
    needs: vars
    uses: ./.github/workflows/lint.yml
    with:
      ref: ${{ needs.vars.outputs.milo_commit }}
    # A called workflow may only narrow what its caller grants, and GitHub
    # refuses the whole run when a nested job declares more — milo-mac-freshness
    # declares issues: write, though it is skipped when called.
    permissions:
      contents: read
      issues: write

  build:
    needs: [vars, checks, frontend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    # Publishing the release needs it, and a job that declares no `permissions:`
    # block inherits the repository default — which here is read-only. Measured
    # the hard way: the v0.2.0 build ran three hours, produced an image that
    # passed inspection, and then failed on its very last step with nothing to
    # show for it. It could not have been caught earlier, because this step had
    # never executed once: the workflow only reaches it on a `v*` tag.
    permissions:
      contents: write

    steps:
      # The token is not persisted for git: this job holds `contents: write`,
      # and every pi-gen stage, build script and package hook it runs could read
      # the file the checkout would write it to. The release step takes the
      # token as its own input, and the tag fetch below reads a public
      # repository.
      #
      # At the commit being built, like the frontend and checks jobs:
      # everything this job takes from its own tree — pi-gen/config, the stage,
      # dependencies.env, system-manifest.env and the tree the inspection
      # compares against — must be the tree the image clones. Without `ref:` a
      # manual dispatch of another ref took them all from the branch it was
      # launched from and cloned the ref it named, three hours for an image of
      # two trees.
      - name: Checkout Milo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.vars.outputs.milo_commit }}
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip \
            dosfstools libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc \
            gpg pigz xxd arch-test

      - name: Download the frontend artefact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: frontend-dist
          path: frontend-artefact

      # The one pi-gen commit every image is built on, read from the file
      # pi-gen/build.sh reads too: the head of a branch moves under a build that
      # names it.
      - name: Fetch pi-gen
        run: |
          source pi-gen/upstream.env
          git init -q pi-gen-build
          git -C pi-gen-build fetch --depth 1 "$PIGEN_REPO" "$PIGEN_COMMIT"
          git -C pi-gen-build checkout -q --detach "$PIGEN_COMMIT"

      - name: Configure pi-gen
        env:
          MILO_COMMIT: ${{ needs.vars.outputs.milo_commit }}
        run: |
          # Copy Milo configuration
          cp pi-gen/config pi-gen-build/config

          # Copy custom stage
          cp -r pi-gen/stage-milo pi-gen-build/stage-milo

          # What the image clones: the repository running this workflow, at the
          # commit being built — never the ref's name, which the chroot would
          # read again hours from now (a tag's checkout is the same detached
          # commit either way, and `git describe` still names the tag). It
          # travels beside the stage like the files below, written by the
          # helper pi-gen/build.sh calls too. Not in pi-gen's config: pi-gen
          # sources it without exporting it, so the MILO_BRANCH line once
          # appended there never reached the stage script, a child process, and
          # every image this workflow built cloned main.
          pi-gen/checkout-env.sh "${MILO_COMMIT}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
             > pi-gen-build/stage-milo/milo-checkout.env

          # The validated dependency set travels with the stage. 01-install-audio
          # sources it as a sibling under `bash -e`, so without this the build
          # aborts on its first line — which is what it has been doing, unnoticed,
          # since dependencies.env landed: this workflow only runs on a `v*` tag
          # or a manual dispatch. pi-gen/build.sh does the same copy for a local
          # build; the two are pinned together by
          # backend/tests/architecture/test_rootfs_deployment.py.
          cp dependencies.env pi-gen-build/stage-milo/dependencies.env

          # The system manifest, for the same reason: 00-install-deps installs
          # its packages before the checkout that carries it is cloned.
          cp system-manifest.env pi-gen-build/stage-milo/system-manifest.env

          # The frontend travels with it for the same reason, under a name that
          # carries no version: the stage installs whatever it is handed, and
          # what it is handed is decided here and in pi-gen/build.sh. 02-install-milo
          # aborts if it is missing rather than falling back to building one,
          # which would put the second, divergent build path straight back.
          cp "frontend-artefact/${{ needs.vars.outputs.frontend_asset }}" \
             pi-gen-build/stage-milo/frontend-dist.tar.gz

          # Prevent intermediate image exports
          touch pi-gen-build/stage2/SKIP_IMAGES

          # Skip desktop stages
          for stage in stage3 stage4 stage5; do
            if [ -d "pi-gen-build/${stage}" ]; then
              touch "pi-gen-build/${stage}/SKIP"
            fi
          done

          # Clean apt cache inside rootfs at end of stage2 to free space before stage-milo
          mkdir -p pi-gen-build/stage2/99-cleanup
          printf '#!/bin/bash -e\non_chroot << CHROOT\napt-get clean\nrm -rf /var/cache/apt/archives/*.deb\nCHROOT\n' > pi-gen-build/stage2/99-cleanup/00-run.sh
          chmod +x pi-gen-build/stage2/99-cleanup/00-run.sh

      - name: Build image
        run: |
          cd pi-gen-build
          sudo SETFCAP=1 ./build.sh
        env:
          DEBIAN_FRONTEND: noninteractive

      # A green build proves the stage scripts ran; it does not prove the image is
      # right. `set -e` catches a command that fails, never one that succeeds
      # while doing the wrong thing. This runs before compression because it
      # needs the raw .img, and it does not stop the job — the artifact uploads
      # either way, so a bad image can still be pulled down and looked at. The
      # verdict is enforced at the end.
      #
      # It compares against this job's checkout, which is the commit the image
      # cloned (it checks that too): both are the commit the vars job resolved,
      # whatever the run was launched from and wherever the ref moved since.
      - name: Inspect image
        id: inspect
        continue-on-error: true
        run: |
          IMAGE=$(ls pi-gen-build/deploy/*.img 2>/dev/null | head -1)
          if [ -z "$IMAGE" ]; then
            ZIP=$(ls pi-gen-build/deploy/*.zip 2>/dev/null | head -1)
            [ -n "$ZIP" ] && sudo unzip -o "$ZIP" -d pi-gen-build/deploy/
            IMAGE=$(ls pi-gen-build/deploy/*.img 2>/dev/null | head -1)
          fi
          [ -n "$IMAGE" ] || { echo "no .img to inspect"; exit 1; }
          sudo ./pi-gen/inspect-image.sh --img "$IMAGE" --ref "${{ needs.vars.outputs.milo_ref }}"

      - name: Compress image
        run: |
          # pi-gen outputs as root — fix permissions first
          sudo chown -R runner:runner pi-gen-build/deploy/

          # pi-gen outputs a .zip — extract the .img first
          ZIP=$(ls pi-gen-build/deploy/*.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            echo "Extracting ${ZIP}..."
            unzip -o "$ZIP" -d pi-gen-build/deploy/
            rm -f "$ZIP"
          fi

          IMAGE=$(ls pi-gen-build/deploy/*.img 2>/dev/null | head -1)
          if [ -z "$IMAGE" ]; then
            echo "ERROR: No .img file found in deploy/"
            ls -la pi-gen-build/deploy/ || true
            exit 1
          fi
          echo "Compressing ${IMAGE}..."
          xz -9 -T0 "${IMAGE}"
          COMPRESSED="${IMAGE}.xz"
          echo "compressed_image=${COMPRESSED}" >> "$GITHUB_ENV"
          echo "image_basename=$(basename "${COMPRESSED}")" >> "$GITHUB_ENV"
          ls -lh "${COMPRESSED}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.vars.outputs.image_name }}
          path: ${{ env.compressed_image }}
          retention-days: 14

      # After the upload, so a failed inspection still leaves an image to examine.
      - name: Fail if the image did not pass inspection
        if: steps.inspect.outcome == 'failure'
        run: |
          echo "The image built but does not contain what it should — see the"
          echo "\"Inspect image\" step above. The artifact was uploaded anyway."
          exit 1

      # What the owner signs: the tag, the commit it names, and the digests of
      # the two artifacts a release is used through. A unit verifies the
      # signature before it installs anything (backend/core/updates/
      # release_signature.py) and checks the frontend and the commit against
      # this file; the image's line is for whoever flashes a card. The keys are
      # frozen and append-only: release N reads release N+1's manifest.
      - name: Write the release manifest
        if: needs.vars.outputs.is_release == 'true'
        run: |
          REF="${{ needs.vars.outputs.milo_ref }}"
          ASSET="${{ needs.vars.outputs.frontend_asset }}"
          MANIFEST="${{ needs.vars.outputs.release_manifest }}"
          IMAGE="${{ env.compressed_image }}"
          {
            echo "tag=${REF}"
            echo "commit=$(git rev-parse HEAD)"
            echo "frontend=${ASSET}"
            echo "frontend_sha256=$(sha256sum "frontend-artefact/${ASSET}" | cut -d' ' -f1)"
            echo "image=$(basename "${IMAGE}")"
            echo "image_sha256=$(sha256sum "${IMAGE}" | cut -d' ' -f1)"
          } > "${MANIFEST}"
          cat "${MANIFEST}"

      # The release is created as a DRAFT: what makes a version installable is
      # the owner's signature, made on his Mac where the key lives and attached
      # before he publishes (tools/release/sign-release.sh) — this job holds no
      # key, so an account that can run it cannot sign. A published release is
      # immutable, so the signature is attached first. Publishing is then what
      # makes it offered: the update flow offers `releases/latest` (a draft
      # never is) and installs that release's tag, and it downloads the
      # frontend asset from here rather than compiling one. A tag whose build
      # never got this far, or that nobody signed, is offered to nobody — the
      # withholding mechanism — and un-publishing a release that turned out bad
      # is the withdrawal, in one gesture, with no unit visited.
      # The release notes are the tag's own annotation, which is where the
      # reasoning for a release is already written. GitHub's generated ones are
      # a commit list the annotation already summarises, under a "New
      # Contributors" heading naming the only person who has ever committed
      # here. The fetch is what makes the annotated tag object local: checkout
      # takes the commit, and `%(contents)` reads the tag object, not the
      # commit message.
      - name: Read the tag annotation
        id: notes
        if: needs.vars.outputs.is_release == 'true'
        run: |
          REF="${{ needs.vars.outputs.milo_ref }}"
          git fetch --force origin "refs/tags/${REF}:refs/tags/${REF}" || true
          {
            echo 'body<<MILO_NOTES_EOF'
            git tag -l --format='%(contents)' "$REF"
            echo 'MILO_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: needs.vars.outputs.is_release == 'true' && github.repository == 'leodurandfr/Milo'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Append-only, the image first: release N downloads by these names.
          # The sidecar is what releases before signing check the frontend
          # against; a signed one reads the manifest's digest.
          files: |
            ${{ env.compressed_image }}
            frontend-artefact/${{ needs.vars.outputs.frontend_asset }}
            frontend-artefact/${{ needs.vars.outputs.frontend_asset }}.sha256
            ${{ needs.vars.outputs.release_manifest }}
          draft: true
          prerelease: ${{ needs.vars.outputs.is_prerelease }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
