name: Build Milo Image

on:
  push:
    tags:
      - 'v*'
  # Weekly, because a build that only runs on a tag is a build nobody runs. This
  # one was broken for three months — `dependencies.env` landed on 2026-08-19 and
  # the stage had sourced a file no builder copied ever since — and the only
  # reason it went unnoticed is that the last tag is v0.1.0. A schedule turns
  # that into a week. Off the top of the hour, and off lint.yml's day, for the
  # reason lint.yml gives: GitHub drops on-the-hour scheduled runs under load.
  schedule:
    - cron: '23 3 * * 3'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to build'
        required: false
        default: 'main'

jobs:
  # What is being built, decided once. Three jobs read it, and the frontend
  # asset's name is part of the answer: the backend builds the very same name
  # from `frontend_asset_url` in backend/core/updates/catalog.py to download it
  # during an OTA update, and the two spellings are pinned together by
  # backend/tests/architecture/test_release_channel.py.
  vars:
    name: Resolve what is being built
    runs-on: ubuntu-24.04
    outputs:
      milo_ref: ${{ steps.set.outputs.milo_ref }}
      image_name: ${{ steps.set.outputs.image_name }}
      is_release: ${{ steps.set.outputs.is_release }}
      is_prerelease: ${{ steps.set.outputs.is_prerelease }}
      frontend_asset: ${{ steps.set.outputs.frontend_asset }}
    steps:
      - name: Set build variables
        id: set
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag push: the release being built.
            REF="${GITHUB_REF#refs/tags/}"
            echo "image_name=milo-${REF}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            # A tag carrying a suffix — v0.2.0-rc1, v0.3.0-beta.2 — is a
            # pre-release. Publishing it as one keeps it out of
            # `releases/latest`, which is the endpoint the update flow offers
            # from: no unit in the field is ever shown it. The backend refuses
            # a non-plain tag on its own side too (helpers.is_stable_release),
            # deliberately — one guarantee spelled twice, because each half
            # survives the other being changed by accident.
            if [[ "${REF}" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            REF="${{ github.event.inputs.branch || 'main' }}"
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "image_name=milo-${REF}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "milo_ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "frontend_asset=milo-frontend-${REF}.tar.gz" >> "$GITHUB_OUTPUT"

  # The frontend is built exactly once, here, and both consumers take that one
  # artefact: the image bakes it in, and the release publishes it for units to
  # download on an OTA update. It used to be built twice — in the pi-gen chroot
  # and again on every Pi during an update — with `npm install` rather than
  # `npm ci` and with whatever Node `n stable` had left on the unit, so no two
  # units ran the same bytes and a bad hour at the npm registry blocked the
  # whole fleet from updating at all.
  frontend:
    name: Build the frontend artefact
    needs: vars
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.vars.outputs.milo_ref }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` installs the lockfile, not a fresh resolution of the ranges in
      # package.json. That is the whole difference between "the tree this release
      # was tested with" and "whatever was current the day the job ran".
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Pack it with its checksum
        run: |
          ASSET="${{ needs.vars.outputs.frontend_asset }}"
          tar -czf "$ASSET" -C frontend dist
          sha256sum "$ASSET" > "${ASSET}.sha256"
          ls -lh "$ASSET"*
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: |
            ${{ needs.vars.outputs.frontend_asset }}
            ${{ needs.vars.outputs.frontend_asset }}.sha256
          retention-days: 14

  build:
    needs: [vars, frontend]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    # Publishing the release needs it, and a job that declares no `permissions:`
    # block inherits the repository default — which here is read-only. Measured
    # the hard way: the v0.2.0 build ran three hours, produced an image that
    # passed inspection, and then failed on its very last step with nothing to
    # show for it. It could not have been caught earlier, because this step had
    # never executed once: the workflow only reaches it on a `v*` tag.
    permissions:
      contents: write

    steps:
      - name: Checkout Milo
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip \
            dosfstools libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc \
            gpg pigz xxd arch-test

      - name: Download the frontend artefact
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend-artefact

      - name: Clone pi-gen
        run: |
          git clone --branch arm64 --depth 1 https://github.com/RPi-Distro/pi-gen.git pi-gen-build

      - name: Configure pi-gen
        run: |
          # Copy Milo configuration
          cp pi-gen/config pi-gen-build/config

          # Set the branch/tag to build
          echo "MILO_BRANCH=${{ needs.vars.outputs.milo_ref }}" >> pi-gen-build/config

          # Copy custom stage
          cp -r pi-gen/stage-milo pi-gen-build/stage-milo

          # The validated dependency set travels with the stage. 01-install-audio
          # sources it as a sibling under `bash -e`, so without this the build
          # aborts on its first line — which is what it has been doing, unnoticed,
          # since dependencies.env landed: this workflow only runs on a `v*` tag
          # or a manual dispatch. pi-gen/build.sh does the same copy for a local
          # build; the two are pinned together by
          # backend/tests/architecture/test_rootfs_deployment.py.
          cp dependencies.env pi-gen-build/stage-milo/dependencies.env

          # The frontend travels with it for the same reason, under a name that
          # carries no version: the stage installs whatever it is handed, and
          # what it is handed is decided here and in pi-gen/build.sh. 02-install-milo
          # aborts if it is missing rather than falling back to building one,
          # which would put the second, divergent build path straight back.
          cp "frontend-artefact/${{ needs.vars.outputs.frontend_asset }}" \
             pi-gen-build/stage-milo/frontend-dist.tar.gz

          # Prevent intermediate image exports
          touch pi-gen-build/stage2/SKIP_IMAGES

          # Skip desktop stages
          for stage in stage3 stage4 stage5; do
            if [ -d "pi-gen-build/${stage}" ]; then
              touch "pi-gen-build/${stage}/SKIP"
            fi
          done

          # Clean apt cache inside rootfs at end of stage2 to free space before stage-milo
          mkdir -p pi-gen-build/stage2/99-cleanup
          printf '#!/bin/bash -e\non_chroot << CHROOT\napt-get clean\nrm -rf /var/cache/apt/archives/*.deb\nCHROOT\n' > pi-gen-build/stage2/99-cleanup/00-run.sh
          chmod +x pi-gen-build/stage2/99-cleanup/00-run.sh

      - name: Build image
        run: |
          cd pi-gen-build
          sudo SETFCAP=1 ./build.sh
        env:
          DEBIAN_FRONTEND: noninteractive

      # A green build proves the stage scripts ran; it does not prove the image is
      # right. `set -e` catches a command that fails, never one that succeeds
      # while doing the wrong thing. This runs before compression because it
      # needs the raw .img, and it does not stop the job — the artifact uploads
      # either way, so a bad image can still be pulled down and looked at. The
      # verdict is enforced at the end.
      #
      # It compares against this checkout, which for a tag build and for a
      # dispatch of `main` is the same tree the image cloned.
      - name: Inspect image
        id: inspect
        continue-on-error: true
        run: |
          IMAGE=$(ls pi-gen-build/deploy/*.img 2>/dev/null | head -1)
          if [ -z "$IMAGE" ]; then
            ZIP=$(ls pi-gen-build/deploy/*.zip 2>/dev/null | head -1)
            [ -n "$ZIP" ] && sudo unzip -o "$ZIP" -d pi-gen-build/deploy/
            IMAGE=$(ls pi-gen-build/deploy/*.img 2>/dev/null | head -1)
          fi
          [ -n "$IMAGE" ] || { echo "no .img to inspect"; exit 1; }
          sudo ./pi-gen/inspect-image.sh --img "$IMAGE" --ref "${{ needs.vars.outputs.milo_ref }}"

      - name: Compress image
        run: |
          # pi-gen outputs as root — fix permissions first
          sudo chown -R runner:runner pi-gen-build/deploy/

          # pi-gen outputs a .zip — extract the .img first
          ZIP=$(ls pi-gen-build/deploy/*.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            echo "Extracting ${ZIP}..."
            unzip -o "$ZIP" -d pi-gen-build/deploy/
            rm -f "$ZIP"
          fi

          IMAGE=$(ls pi-gen-build/deploy/*.img 2>/dev/null | head -1)
          if [ -z "$IMAGE" ]; then
            echo "ERROR: No .img file found in deploy/"
            ls -la pi-gen-build/deploy/ || true
            exit 1
          fi
          echo "Compressing ${IMAGE}..."
          xz -9 -T0 "${IMAGE}"
          COMPRESSED="${IMAGE}.xz"
          echo "compressed_image=${COMPRESSED}" >> "$GITHUB_ENV"
          echo "image_basename=$(basename "${COMPRESSED}")" >> "$GITHUB_ENV"
          ls -lh "${COMPRESSED}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.vars.outputs.image_name }}
          path: ${{ env.compressed_image }}
          retention-days: 14

      # After the upload, so a failed inspection still leaves an image to examine.
      - name: Fail if the image did not pass inspection
        if: steps.inspect.outcome == 'failure'
        run: |
          echo "The image built but does not contain what it should — see the"
          echo "\"Inspect image\" step above. The artifact was uploaded anyway."
          exit 1

      # Publishing the release is what makes the version installable: the update
      # flow offers `releases/latest` and installs that release's tag, and it
      # downloads the frontend asset from here rather than compiling one. A tag
      # whose build never got this far is therefore offered to nobody, which is
      # the withholding mechanism — and un-publishing a release that turned out
      # bad is the withdrawal, in one gesture, with no unit visited.
      # The release notes are the tag's own annotation, which is where the
      # reasoning for a release is already written. GitHub's generated ones are
      # a commit list the annotation already summarises, under a "New
      # Contributors" heading naming the only person who has ever committed
      # here. The fetch is what makes the annotated tag object local: checkout
      # takes the commit, and `%(contents)` reads the tag object, not the
      # commit message.
      - name: Read the tag annotation
        id: notes
        if: needs.vars.outputs.is_release == 'true'
        run: |
          REF="${{ needs.vars.outputs.milo_ref }}"
          git fetch --force origin "refs/tags/${REF}:refs/tags/${REF}" || true
          {
            echo 'body<<MILO_NOTES_EOF'
            git tag -l --format='%(contents)' "$REF"
            echo 'MILO_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: needs.vars.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.compressed_image }}
            frontend-artefact/${{ needs.vars.outputs.frontend_asset }}
            frontend-artefact/${{ needs.vars.outputs.frontend_asset }}.sha256
          prerelease: ${{ needs.vars.outputs.is_prerelease }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
