name: Lint and Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # build-image.yml runs these checks on the tree it is about to build, and its
  # build job needs them: a release is published only from a tree they passed on.
  workflow_call:
    inputs:
      ref:
        description: 'The branch, tag or commit being built'
        required: true
        type: string
  # Weekly backstop for the milo-mac-freshness job (it also runs on every push to
  # main). Off the top of the hour: GitHub drops on-the-hour scheduled runs under
  # load, which is why this job used to never fire.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# A fork runs this file too, on its own pushes and pull requests, and the checks
# are how its owner proves a change before proposing it (a pull request opened
# here from a fork runs here, as this repository), so every job below runs on
# a fork's push, pull request and manual run. What a fork does not run is what
# spends or writes on the owner's behalf: the schedule (a fork's Actions would
# burn a weekly run on a tree its owner never asked to watch) and
# milo-mac-freshness, which opens issues. Each
# job is guarded by name, because GitHub has no workflow-level `if:`; the
# repository is the one units take their releases from
# (backend/core/updates/catalog.py), and the guards are held by
# backend/tests/architecture/test_ci_forks.py, which evaluates every condition
# here as a fork and as this repository.

# The checks need nothing more. Said here because build-image.yml grants the
# call `issues: write` for milo-mac-freshness, and a job declaring nothing
# would inherit it.
permissions:
  contents: read

# Every action is named by the commit it runs, its release beside it: a tag is a
# pointer its owner can move, and the next run would execute whatever it then
# names. To move one, read the release's commit (`git ls-remote --tags
# https://github.com/<owner>/<action>`, the `^{}` line for an annotated tag) and
# change both. No checkout persists the job's token: actions/checkout v6 writes
# it to a file under $RUNNER_TEMP that the repository's git config includes, and
# any later step can read it there. Held by
# backend/tests/architecture/test_ci_pins.py.

jobs:
  backend:
    name: Backend + satellite (ruff + pytest)
    if: github.event_name != 'schedule' || github.repository == 'leodurandfr/Milo'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # `inputs.ref` is set only when build-image.yml calls this file; empty,
      # the checkout takes the event's own commit, as before.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      # `discid` dlopens libdiscid.so.0 at *import* time, and the CD tests patch
      # `discid.read` -- which imports it; `cairosvg` does the same with
      # libcairo.so.2 (radio logos). The appliance ships both libraries
      # (system-manifest.env, installed by the image and by every update), so the
      # tests pass on the unit and only ever fail here.
      - name: Install the native libraries the tests import
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdiscid0 libcairo2
      # The lock a unit installs, with the same --require-hashes, so the suite
      # runs the versions the appliance runs; then the test runner and the
      # linter, which never reach a unit.
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
      # milo-client/ is the satellite half of the appliance and ships in the same
      # commit as the server, so it is gated by the same job — not a separate one.
      # Its lock pins every package it shares with the server's at the server's
      # version (test_python_lock.py), so nothing extra to install.
      - name: Lint with ruff
        run: ruff check backend/ milo-client/
      # Two invocations, not `pytest backend/ milo-client/`: a combined run puts
      # rootdir at the repo root, which drops backend/pytest.ini and with it
      # `asyncio_mode = auto` — every unmarked async backend test then errors.
      - name: Run backend tests
        run: pytest backend/
      - name: Run satellite tests
        run: pytest milo-client/

  frontend:
    name: Frontend (eslint + stylelint + vitest)
    if: github.event_name != 'schedule' || github.repository == 'leodurandfr/Milo'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint JS
        working-directory: frontend
        run: npm run lint:js
      - name: Lint CSS
        working-directory: frontend
        run: npm run lint:css
      # The structural guardrails (tests/i18n, tests/schemas, tests/architecture)
      # read backend sources — backend/core/models/ws_events.py, audio_state.py —
      # so this job needs the whole checkout, not just frontend/.
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

  # No secret enters the history unseen. The repository's own past was swept
  # once by hand, with the same gitleaks, and what it holds is known (two
  # revoked podcast keys, documentation examples, none left in the tree); on a
  # push or a pull request this job looks only at what it brings, so a known
  # past finding never reddens a run and a new one always does, and any other
  # run scans the tree as it stands. gitleaks reads the added lines of each
  # commit in the range, extending its default rules with the narrow allowlist
  # in .gitleaks.toml (inline `gitleaks:allow` comments are ignored, and no
  # .gitleaksignore is kept), and prints every finding redacted: the log names
  # the rule, the commit, the file and the line, never the value. A merge
  # commit's own patch is not read (`git log -p` shows none), so a line that
  # exists only in a merge resolution is seen by the tree scan alone; work lands
  # on main as plain commits, and a merged branch's lines are read in its own.
  secrets:
    name: Secrets (gitleaks)
    if: github.event_name != 'schedule' || github.repository == 'leodurandfr/Milo'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The one place the scanner is pinned: a release asset named by its version
    # and held to its sha256 (from the release's gitleaks_<v>_checksums.txt)
    # before it runs. To move it, take both from the same release.
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      # The whole history, so the start of any pushed range is in the clone.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$asset" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks
          echo "GITLEAKS=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
      # What each event brings:
      #   push          the pushed range, before..sha;
      #   pull_request  the PR's own commits, base..head;
      #   otherwise     the tree as it stands — an image build (`inputs.ref` set,
      #                 whatever the caller's event: a tag push has no range of
      #                 its own), the weekly schedule, a manual run.
      # A range whose start is not in the clone falls back to the tree too: a
      # new branch (`before` is all zeros) or a force push that rewrote `before`
      # away. A secret added and removed inside such a push is then not seen;
      # the tree that remains is.
      - name: Scan what this event brings
        env:
          EVENT: ${{ github.event_name }}
          CALLED_REF: ${{ inputs.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scan_tree() {
            echo "Scanning the tree at $(git rev-parse HEAD)"
            tree="$RUNNER_TEMP/gitleaks-tree"
            rm -rf "$tree" && mkdir -p "$tree"
            git archive --format=tar HEAD | tar -x -C "$tree"
            "$GITLEAKS" dir "$tree" --config .gitleaks.toml --redact --ignore-gitleaks-allow --verbose --no-banner
          }
          scan_range() {
            if ! git cat-file -e "$1^{commit}" 2>/dev/null; then
              echo "The range start $1 is not in the clone"
              scan_tree
              return
            fi
            echo "Scanning $1..$2"
            "$GITLEAKS" git . --config .gitleaks.toml --redact --ignore-gitleaks-allow --verbose --no-banner --log-opts="$1..$2"
          }
          if [ -n "$CALLED_REF" ]; then
            scan_tree
          elif [ "$EVENT" = pull_request ]; then
            scan_range "$PR_BASE" "$PR_HEAD"
          elif [ "$EVENT" = push ]; then
            scan_range "$PUSH_BEFORE" "$PUSH_AFTER"
          else
            scan_tree
          fi

  milo-mac-freshness:
    name: Milo-Mac contract freshness (non-blocking)
    # Staleness detector for the VENDORED snapshot under
    # backend/tests/contracts/vendor/milo-mac/: re-clones the (public) Milo-Mac app
    # and checks whether its real REST/WS surface has moved past the committed
    # snapshot (and thus the manifest). The OFFLINE half (test_milo_mac_contract.py)
    # already gates every PR inside the backend job — it enforces manifest ==
    # vendored snapshot deterministically; THIS job is the network half that tells a
    # human to refresh the snapshot. On drift it opens/updates a tracking issue (a
    # durable signal, unlike a scrolling annotation); when back in sync it closes it.
    # Runs on every push to main + a weekly cron backstop, never on PRs, and never
    # blocks: a network hiccup or an upstream refactor can't gate a merge. Nor
    # when build-image.yml calls this file (`inputs.ref` set): an image build
    # has nothing to learn from it. Nor on a fork: the issue it opens would land
    # in the fork, about a snapshot only this repository refreshes.
    if: github.repository == 'leodurandfr/Milo' && github.event_name != 'pull_request' && !inputs.ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Never block a merge or redden the run: a network/repo hiccup or an upstream
    # refactor only ever opens a tracking issue (via the check step's own outcome).
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    concurrency:
      group: milo-mac-freshness
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Clone upstream Milo-Mac (public)
        run: git clone --depth 1 https://github.com/leodurandfr/Milo-Mac /tmp/milo-mac
      - name: Compare vendored snapshot to upstream
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          python backend/tests/contracts/check_milo_mac_freshness.py /tmp/milo-mac | tee /tmp/freshness.txt
      - name: Open drift issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create milo-mac-drift --color B60205 \
            --description "Vendored Milo-Mac snapshot is behind upstream" 2>/dev/null || true
          open=$(gh issue list --label milo-mac-drift --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create \
              --title "Milo-Mac contract drift: refresh the vendored snapshot" \
              --label milo-mac-drift \
              --body "$(printf 'Upstream Milo-Mac has moved past the vendored snapshot under \`backend/tests/contracts/vendor/milo-mac/\`.\n\nRefresh the vendored .swift files **and** \`milo_mac_contract.json\` together, then re-run \`pytest backend/tests/contracts/\`. See CLAUDE.md §%sExternal API clients — Milo-Mac and Milo-iOS%s.\n\n```\n%s\n```\n' "'" "'" "$(cat /tmp/freshness.txt)")"
          fi
      - name: Close drift issue (back in sync)
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label milo-mac-drift --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Vendored snapshot is back in sync with upstream Milo-Mac — auto-closing."
          done
