name: Lint and Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint with ruff
        run: ruff check backend/
      - name: Run backend tests
        run: pytest backend/

  frontend:
    name: Frontend (eslint + stylelint + vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint JS
        working-directory: frontend
        run: npm run lint:js
      - name: Lint CSS
        working-directory: frontend
        run: npm run lint:css
      # Frontend tests (vitest) are temporarily skipped in CI — the suite still
      # mocks `axios.*` directly, but RFC 17 migrated stores to apiCall, so 97
      # tests are stale. Re-enable once the suite has been retargeted at
      # `apiCall` / fetch mocking.
